name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # electron-builder uploads installers to the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      # Serial: two parallel jobs race to create the SAME GitHub release and
      # produce two duplicate release records for one tag.
      max-parallel: 1
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # unsigned builds — stop electron-builder hunting for a mac cert
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
